<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <title>Hello Sokol</title>
    <meta name="title" content="Hello Sokol">
    <meta name="description" content="Odin + Sokol textured quad demo">
    <meta name="viewport" content="width=device-width">
    <link rel="icon" href="data:,">

    <style>
        body {
            margin: 0;
            background-color: black;
        }

        canvas.game_canvas {
            position: absolute;
            top: 0px;
            left: 0px;
            margin: 0px;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: block;
            image-rendering: optimizeSpeed;
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            -ms-interpolation-mode: nearest-neighbor;
        }

        .heading {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff1e4;
            text-decoration: none;
            z-index: 1;
            font-family: "Arial", sans-serif;
            font-size: 24px;
            font-weight: bold;
        }

        .heading span {
            display: inline-block;
            margin-right: 24px;
        }

        .heading a {
            color: #0d528f;
        }
    </style>
</head>

<body>
    <canvas class="game_canvas" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"
        onmousedown="event.target.focus()" onkeydown="event.preventDefault()"></canvas>
    <script type="text/javascript" src="odin.js"></script>
    <script>
        var odinMemoryInterface = new odin.WasmMemoryInterface();

        // `4` for `js_wasm32` target, `8` for `js_wasm64p32` target.
        odinMemoryInterface.setIntSize(4);
        var odinImports = odin.setupDefaultImports(odinMemoryInterface);
        var appExports;

        // The Module is used as configuration for emscripten.
        var Module = {
            // This is called by emscripten when it starts up.
            instantiateWasm: (imports, successCallback) => {
                const newImports = {
                    ...odinImports,
                    ...imports
                };

                // This will load the WASM file with the game inside. It will
                // use both the emscripten and odin.js imports. This makes it
                // possible to use the `js` "OS" in our Odin code.
                // ArrayBuffer loading also works with servers lacking the Wasm MIME type.
                fetch("index.wasm").then(response => {
                    if (!response.ok) throw new Error(`Wasm download failed: ${response.status}`);
                    return response.arrayBuffer();
                }).then(bytes => WebAssembly.instantiate(bytes, newImports)).then(function (output) {
                    appExports = output.instance.exports;
                    odinMemoryInterface.setExports(output.instance.exports);
                    odinMemoryInterface.setMemory(output.instance.exports.memory);
                    successCallback(output.instance, output.module);
                }).catch(error => {
                    console.error("Unable to start Hello Sokol:", error);
                });
                return {};
            },
            // This happens a bit after `instantiateWasm`, when everything is
            // done setting up. At that point we can run code.
            onRuntimeInitialized: () => {
                // This calls all procedures tagged with `@init` and then
                // it calls main. Sokol schedules browser frames and returns;
                // keep the runtime alive rather than calling _end here.
                appExports._start();
            },
            print: (function () {
                var element = document.getElementById("output");
                if (element) element.value = ''; // clear browser cache
                return function (text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                    if (element) {
                        element.value += text + "\n";
                        element.scrollTop = element.scrollHeight; // focus on bottom
                    }
                };
            })(),
            canvas: (function () {
                return document.getElementById("canvas");
            })()
        };
    </script>

    <!-- Emscripten injects its javascript here -->
    {{{ SCRIPT }}}
</body>

</html>
